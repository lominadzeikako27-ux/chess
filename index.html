<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chess</title>
  </head>
  <body>
    <h1>ჭადრაკი</h1>
    <table class="chess-board">
      <tr>
        <th></th>
        <th>a</th>
        <th>b</th>
        <th>c</th>
        <th>d</th>
        <th>e</th>
        <th>f</th>
        <th>g</th>
        <th>h</th>
      </tr>
      <tr class="chess-board">
        <th>8</th>
        <td class="tan white-pieces">♜</td>
        <td class="brown white-pieces">♞</td>
        <td class="tan white-pieces">♝</td>
        <td class="brown white-pieces">♛</td>
        <td class="tan white-pieces">♚</td>
        <td class="brown white-pieces">♝</td>
        <td class="tan white-pieces">♞</td>
        <td class="brown white-pieces">♜</td>
      </tr>
      <tr>
        <th>7</th>
        <td class="brown white-pieces">♟</td>
        <td class="tan white-pieces">♟</td>
        <td class="brown white-pieces">♟</td>
        <td class="tan white-pieces">♟</td>
        <td class="brown white-pieces">♟</td>
        <td class="tan white-pieces">♟</td>
        <td class="brown white-pieces">♟</td>
        <td class="tan white-pieces">♟</td>
      </tr>
      <tr>
        <th>6</th>
        <td class="tan"></td>
        <td class="brown"></td>
        <td class="tan"></td>
        <td class="brown"></td>
        <td class="tan"></td>
        <td class="brown"></td>
        <td class="tan"></td>
        <td class="brown"></td>
      </tr>
      <tr>
        <th>5</th>
        <td class="brown"></td>
        <td class="tan"></td>
        <td class="brown"></td>
        <td class="tan"></td>
        <td class="brown"></td>
        <td class="tan"></td>
        <td class="brown"></td>
        <td class="tan"></td>
      </tr>
      <tr>
        <th>4</th>
        <td class="tan"></td>
        <td class="brown"></td>
        <td class="tan"></td>
        <td class="brown"></td>
        <td class="tan"></td>
        <td class="brown"></td>
        <td class="tan"></td>
        <td class="brown"></td>
      </tr>
      <tr>
        <th>3</th>
        <td class="brown"></td>
        <td class="tan"></td>
        <td class="brown"></td>
        <td class="tan"></td>
        <td class="brown"></td>
        <td class="tan"></td>
        <td class="brown"></td>
        <td class="tan"></td>
      </tr>
      <tr>
        <th>2</th>
        <td class="tan">♟</td>
        <td class="brown">♟</td>
        <td class="tan">♟</td>
        <td class="brown">♟</td>
        <td class="tan">♟</td>
        <td class="brown">♟</td>
        <td class="tan">♟</td>
        <td class="brown">♟</td>
      </tr>
      <tr>
        <th>1</th>
        <td class="brown">♜</td>
        <td class="tan">♞</td>
        <td class="brown">♝</td>
        <td class="tan">♛</td>
        <td class="brown">♚</td>
        <td class="tan">♝</td>
        <td class="brown">♞</td>
        <td class="tan">♜</td>
      </tr>
    </table>
  </body>
</html>
